AWSTemplateFormatVersion: "2010-09-09"
Description: >
  MegaFab 01 - Networking. Application VPC (public / app / data tiers across 2 AZs),
  Management VPC, VPC peering, NAT, S3 gateway endpoint, layered network ACLs and VPC Flow Logs.

Parameters:
  Project: { Type: String, Default: megafab }
  AppVpcCidr: { Type: String, Default: 10.10.0.0/16 }
  MgmtVpcCidr: { Type: String, Default: 10.20.0.0/16 }
  HighAvailabilityNat:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"
    Description: true = one NAT gateway per AZ (production). false = single NAT (lab cost saving).
  FlowLogBucketArn: { Type: String, Description: ARN of the S3 logs bucket for VPC flow logs }

Conditions:
  HaNat: !Equals [!Ref HighAvailabilityNat, "true"]

Resources:
  # ---------------------------------------------------------------- Application VPC
  AppVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref AppVpcCidr
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags: [{ Key: Name, Value: !Sub "${Project}-app-vpc" }, { Key: Project, Value: !Ref Project }]
  Igw:
    Type: AWS::EC2::InternetGateway
    Properties: { Tags: [{ Key: Name, Value: !Sub "${Project}-igw" }] }
  IgwAttach:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties: { VpcId: !Ref AppVpc, InternetGatewayId: !Ref Igw }

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref AppVpc
      CidrBlock: !Select [0, !Cidr [!Ref AppVpcCidr, 64, 8]]   # 10.10.0.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags: [{ Key: Name, Value: !Sub "${Project}-public-a" }, { Key: Tier, Value: public }]
  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref AppVpc
      CidrBlock: !Select [1, !Cidr [!Ref AppVpcCidr, 64, 8]]   # 10.10.1.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags: [{ Key: Name, Value: !Sub "${Project}-public-b" }, { Key: Tier, Value: public }]
  AppSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref AppVpc
      CidrBlock: !Select [10, !Cidr [!Ref AppVpcCidr, 64, 8]]  # 10.10.10.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags: [{ Key: Name, Value: !Sub "${Project}-app-a" }, { Key: Tier, Value: app }]
  AppSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref AppVpc
      CidrBlock: !Select [11, !Cidr [!Ref AppVpcCidr, 64, 8]]  # 10.10.11.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      Tags: [{ Key: Name, Value: !Sub "${Project}-app-b" }, { Key: Tier, Value: app }]
  DataSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref AppVpc
      CidrBlock: !Select [20, !Cidr [!Ref AppVpcCidr, 64, 8]]  # 10.10.20.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags: [{ Key: Name, Value: !Sub "${Project}-data-a" }, { Key: Tier, Value: data }]
  DataSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref AppVpc
      CidrBlock: !Select [21, !Cidr [!Ref AppVpcCidr, 64, 8]]  # 10.10.21.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      Tags: [{ Key: Name, Value: !Sub "${Project}-data-b" }, { Key: Tier, Value: data }]

  NatEipA:
    Type: AWS::EC2::EIP
    DependsOn: IgwAttach
    Properties: { Domain: vpc, Tags: [{ Key: Name, Value: !Sub "${Project}-nat-a" }] }
  NatA:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEipA.AllocationId
      SubnetId: !Ref PublicSubnetA
      Tags: [{ Key: Name, Value: !Sub "${Project}-nat-a" }]
  NatEipB:
    Type: AWS::EC2::EIP
    Condition: HaNat
    DependsOn: IgwAttach
    Properties: { Domain: vpc }
  NatB:
    Type: AWS::EC2::NatGateway
    Condition: HaNat
    Properties:
      AllocationId: !GetAtt NatEipB.AllocationId
      SubnetId: !Ref PublicSubnetB
      Tags: [{ Key: Name, Value: !Sub "${Project}-nat-b" }]

  PublicRt:
    Type: AWS::EC2::RouteTable
    Properties: { VpcId: !Ref AppVpc, Tags: [{ Key: Name, Value: !Sub "${Project}-public-rt" }] }
  PublicDefault:
    Type: AWS::EC2::Route
    DependsOn: IgwAttach
    Properties: { RouteTableId: !Ref PublicRt, DestinationCidrBlock: 0.0.0.0/0, GatewayId: !Ref Igw }
  PrivateRtA:
    Type: AWS::EC2::RouteTable
    Properties: { VpcId: !Ref AppVpc, Tags: [{ Key: Name, Value: !Sub "${Project}-private-rt-a" }] }
  PrivateRtB:
    Type: AWS::EC2::RouteTable
    Properties: { VpcId: !Ref AppVpc, Tags: [{ Key: Name, Value: !Sub "${Project}-private-rt-b" }] }
  PrivateDefaultA:
    Type: AWS::EC2::Route
    Properties: { RouteTableId: !Ref PrivateRtA, DestinationCidrBlock: 0.0.0.0/0, NatGatewayId: !Ref NatA }
  PrivateDefaultB:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRtB
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !If [HaNat, !Ref NatB, !Ref NatA]
  DataRt:
    Type: AWS::EC2::RouteTable
    Properties: { VpcId: !Ref AppVpc, Tags: [{ Key: Name, Value: !Sub "${Project}-data-rt (no internet)" }] }

  PubAssocA: { Type: AWS::EC2::SubnetRouteTableAssociation, Properties: { SubnetId: !Ref PublicSubnetA, RouteTableId: !Ref PublicRt } }
  PubAssocB: { Type: AWS::EC2::SubnetRouteTableAssociation, Properties: { SubnetId: !Ref PublicSubnetB, RouteTableId: !Ref PublicRt } }
  AppAssocA: { Type: AWS::EC2::SubnetRouteTableAssociation, Properties: { SubnetId: !Ref AppSubnetA, RouteTableId: !Ref PrivateRtA } }
  AppAssocB: { Type: AWS::EC2::SubnetRouteTableAssociation, Properties: { SubnetId: !Ref AppSubnetB, RouteTableId: !Ref PrivateRtB } }
  DataAssocA: { Type: AWS::EC2::SubnetRouteTableAssociation, Properties: { SubnetId: !Ref DataSubnetA, RouteTableId: !Ref DataRt } }
  DataAssocB: { Type: AWS::EC2::SubnetRouteTableAssociation, Properties: { SubnetId: !Ref DataSubnetB, RouteTableId: !Ref DataRt } }

  # Free gateway endpoint: S3 traffic from private subnets never leaves the AWS network / NAT
  S3Endpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref AppVpc
      ServiceName: !Sub com.amazonaws.${AWS::Region}.s3
      VpcEndpointType: Gateway
      RouteTableIds: [!Ref PrivateRtA, !Ref PrivateRtB, !Ref PublicRt]

  # ---------------------------------------------------------------- Management VPC
  MgmtVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref MgmtVpcCidr
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags: [{ Key: Name, Value: !Sub "${Project}-mgmt-vpc" }, { Key: Project, Value: !Ref Project }]
  MgmtIgw:
    Type: AWS::EC2::InternetGateway
    Properties: { Tags: [{ Key: Name, Value: !Sub "${Project}-mgmt-igw" }] }
  MgmtIgwAttach:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties: { VpcId: !Ref MgmtVpc, InternetGatewayId: !Ref MgmtIgw }
  MgmtSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref MgmtVpc
      CidrBlock: !Select [0, !Cidr [!Ref MgmtVpcCidr, 16, 8]]
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: !Sub "${Project}-mgmt-public" }]
  MgmtRt:
    Type: AWS::EC2::RouteTable
    Properties: { VpcId: !Ref MgmtVpc, Tags: [{ Key: Name, Value: !Sub "${Project}-mgmt-rt" }] }
  MgmtDefault:
    Type: AWS::EC2::Route
    DependsOn: MgmtIgwAttach
    Properties: { RouteTableId: !Ref MgmtRt, DestinationCidrBlock: 0.0.0.0/0, GatewayId: !Ref MgmtIgw }
  MgmtAssoc: { Type: AWS::EC2::SubnetRouteTableAssociation, Properties: { SubnetId: !Ref MgmtSubnet, RouteTableId: !Ref MgmtRt } }

  # ---------------------------------------------------------------- VPC peering (private admin path)
  Peering:
    Type: AWS::EC2::VPCPeeringConnection
    Properties:
      VpcId: !Ref MgmtVpc
      PeerVpcId: !Ref AppVpc
      Tags: [{ Key: Name, Value: !Sub "${Project}-mgmt-to-app" }]
  PeerRouteMgmt:
    Type: AWS::EC2::Route
    Properties: { RouteTableId: !Ref MgmtRt, DestinationCidrBlock: !Ref AppVpcCidr, VpcPeeringConnectionId: !Ref Peering }
  PeerRouteAppA:
    Type: AWS::EC2::Route
    Properties: { RouteTableId: !Ref PrivateRtA, DestinationCidrBlock: !Ref MgmtVpcCidr, VpcPeeringConnectionId: !Ref Peering }
  PeerRouteAppB:
    Type: AWS::EC2::Route
    Properties: { RouteTableId: !Ref PrivateRtB, DestinationCidrBlock: !Ref MgmtVpcCidr, VpcPeeringConnectionId: !Ref Peering }
  PeerRouteData:
    Type: AWS::EC2::Route
    Properties: { RouteTableId: !Ref DataRt, DestinationCidrBlock: !Ref MgmtVpcCidr, VpcPeeringConnectionId: !Ref Peering }
  PeerRoutePublic:
    Type: AWS::EC2::Route
    Properties: { RouteTableId: !Ref PublicRt, DestinationCidrBlock: !Ref MgmtVpcCidr, VpcPeeringConnectionId: !Ref Peering }

  # ---------------------------------------------------------------- Network ACLs (subnet-level, stateless)
  PublicNacl:
    Type: AWS::EC2::NetworkAcl
    Properties: { VpcId: !Ref AppVpc, Tags: [{ Key: Name, Value: !Sub "${Project}-public-nacl" }] }
  PubIn80:  { Type: AWS::EC2::NetworkAclEntry, Properties: { NetworkAclId: !Ref PublicNacl, RuleNumber: 100, Protocol: 6, RuleAction: allow, CidrBlock: 0.0.0.0/0, PortRange: { From: 80, To: 80 } } }
  PubIn443: { Type: AWS::EC2::NetworkAclEntry, Properties: { NetworkAclId: !Ref PublicNacl, RuleNumber: 110, Protocol: 6, RuleAction: allow, CidrBlock: 0.0.0.0/0, PortRange: { From: 443, To: 443 } } }
  PubInEph: { Type: AWS::EC2::NetworkAclEntry, Properties: { NetworkAclId: !Ref PublicNacl, RuleNumber: 120, Protocol: 6, RuleAction: allow, CidrBlock: 0.0.0.0/0, PortRange: { From: 1024, To: 65535 } } }
  PubInVpc: { Type: AWS::EC2::NetworkAclEntry, Properties: { NetworkAclId: !Ref PublicNacl, RuleNumber: 130, Protocol: -1, RuleAction: allow, CidrBlock: !Ref AppVpcCidr } }
  PubInSsh: { Type: AWS::EC2::NetworkAclEntry, Properties: { NetworkAclId: !Ref PublicNacl, RuleNumber: 90, Protocol: 6, RuleAction: deny, CidrBlock: 0.0.0.0/0, PortRange: { From: 22, To: 22 } } }
  PubInRdp: { Type: AWS::EC2::NetworkAclEntry, Properties: { NetworkAclId: !Ref PublicNacl, RuleNumber: 91, Protocol: 6, RuleAction: deny, CidrBlock: 0.0.0.0/0, PortRange: { From: 3389, To: 3389 } } }
  PubOut:   { Type: AWS::EC2::NetworkAclEntry, Properties: { NetworkAclId: !Ref PublicNacl, RuleNumber: 100, Protocol: -1, Egress: true, RuleAction: allow, CidrBlock: 0.0.0.0/0 } }

  AppNacl:
    Type: AWS::EC2::NetworkAcl
    Properties: { VpcId: !Ref AppVpc, Tags: [{ Key: Name, Value: !Sub "${Project}-app-nacl" }] }
  AppInVpc:  { Type: AWS::EC2::NetworkAclEntry, Properties: { NetworkAclId: !Ref AppNacl, RuleNumber: 100, Protocol: -1, RuleAction: allow, CidrBlock: !Ref AppVpcCidr } }
  AppInMgmt: { Type: AWS::EC2::NetworkAclEntry, Properties: { NetworkAclId: !Ref AppNacl, RuleNumber: 110, Protocol: 6, RuleAction: allow, CidrBlock: !Ref MgmtVpcCidr, PortRange: { From: 22, To: 22 } } }
  AppInMgmtWeb: { Type: AWS::EC2::NetworkAclEntry, Properties: { NetworkAclId: !Ref AppNacl, RuleNumber: 115, Protocol: 6, RuleAction: allow, CidrBlock: !Ref MgmtVpcCidr, PortRange: { From: 80, To: 80 } } }
  AppInEph:  { Type: AWS::EC2::NetworkAclEntry, Properties: { NetworkAclId: !Ref AppNacl, RuleNumber: 120, Protocol: 6, RuleAction: allow, CidrBlock: 0.0.0.0/0, PortRange: { From: 1024, To: 65535 } } }
  AppOut:    { Type: AWS::EC2::NetworkAclEntry, Properties: { NetworkAclId: !Ref AppNacl, RuleNumber: 100, Protocol: -1, Egress: true, RuleAction: allow, CidrBlock: 0.0.0.0/0 } }

  DataNacl:
    Type: AWS::EC2::NetworkAcl
    Properties: { VpcId: !Ref AppVpc, Tags: [{ Key: Name, Value: !Sub "${Project}-data-nacl" }] }
  DataInAppA: { Type: AWS::EC2::NetworkAclEntry, Properties: { NetworkAclId: !Ref DataNacl, RuleNumber: 100, Protocol: 6, RuleAction: allow, CidrBlock: !Select [10, !Cidr [!Ref AppVpcCidr, 64, 8]], PortRange: { From: 3306, To: 3306 } } }
  DataInAppB: { Type: AWS::EC2::NetworkAclEntry, Properties: { NetworkAclId: !Ref DataNacl, RuleNumber: 110, Protocol: 6, RuleAction: allow, CidrBlock: !Select [11, !Cidr [!Ref AppVpcCidr, 64, 8]], PortRange: { From: 3306, To: 3306 } } }
  DataInMgmt: { Type: AWS::EC2::NetworkAclEntry, Properties: { NetworkAclId: !Ref DataNacl, RuleNumber: 120, Protocol: 6, RuleAction: allow, CidrBlock: !Ref MgmtVpcCidr, PortRange: { From: 3306, To: 3306 } } }
  DataInPeer: { Type: AWS::EC2::NetworkAclEntry, Properties: { NetworkAclId: !Ref DataNacl, RuleNumber: 130, Protocol: -1, RuleAction: allow, CidrBlock: !Select [10, !Cidr [!Ref AppVpcCidr, 128, 9]] } }  # 10.10.20.0/23 = both data subnets talk to each other (Multi-AZ replication)
  DataOutVpc: { Type: AWS::EC2::NetworkAclEntry, Properties: { NetworkAclId: !Ref DataNacl, RuleNumber: 100, Protocol: -1, Egress: true, RuleAction: allow, CidrBlock: !Ref AppVpcCidr } }
  DataOutMgmt: { Type: AWS::EC2::NetworkAclEntry, Properties: { NetworkAclId: !Ref DataNacl, RuleNumber: 110, Protocol: 6, Egress: true, RuleAction: allow, CidrBlock: !Ref MgmtVpcCidr, PortRange: { From: 1024, To: 65535 } } }

  PubNaclA: { Type: AWS::EC2::SubnetNetworkAclAssociation, Properties: { SubnetId: !Ref PublicSubnetA, NetworkAclId: !Ref PublicNacl } }
  PubNaclB: { Type: AWS::EC2::SubnetNetworkAclAssociation, Properties: { SubnetId: !Ref PublicSubnetB, NetworkAclId: !Ref PublicNacl } }
  AppNaclA: { Type: AWS::EC2::SubnetNetworkAclAssociation, Properties: { SubnetId: !Ref AppSubnetA, NetworkAclId: !Ref AppNacl } }
  AppNaclB: { Type: AWS::EC2::SubnetNetworkAclAssociation, Properties: { SubnetId: !Ref AppSubnetB, NetworkAclId: !Ref AppNacl } }
  DataNaclA: { Type: AWS::EC2::SubnetNetworkAclAssociation, Properties: { SubnetId: !Ref DataSubnetA, NetworkAclId: !Ref DataNacl } }
  DataNaclB: { Type: AWS::EC2::SubnetNetworkAclAssociation, Properties: { SubnetId: !Ref DataSubnetB, NetworkAclId: !Ref DataNacl } }

  # ---------------------------------------------------------------- VPC Flow Logs -> S3 (network audit trail)
  AppFlowLog:
    Type: AWS::EC2::FlowLog
    Properties:
      ResourceId: !Ref AppVpc
      ResourceType: VPC
      TrafficType: REJECT
      LogDestinationType: s3
      LogDestination: !Sub "${FlowLogBucketArn}/vpc-flow-logs/"
      MaxAggregationInterval: 600

Outputs:
  AppVpcId: { Value: !Ref AppVpc }
  MgmtVpcId: { Value: !Ref MgmtVpc }
  PublicSubnets: { Value: !Join [",", [!Ref PublicSubnetA, !Ref PublicSubnetB]] }
  AppSubnets: { Value: !Join [",", [!Ref AppSubnetA, !Ref AppSubnetB]] }
  DataSubnets: { Value: !Join [",", [!Ref DataSubnetA, !Ref DataSubnetB]] }
  MgmtSubnet: { Value: !Ref MgmtSubnet }
  PeeringId: { Value: !Ref Peering }
  AppVpcCidr: { Value: !Ref AppVpcCidr }
  MgmtVpcCidr: { Value: !Ref MgmtVpcCidr }
